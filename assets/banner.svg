<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="Youssef Mohammed — Software Engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F2F2F3" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="84%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C8354A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8E1B2A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C8354A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E1B2A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8E1B2A"/>
      <stop offset="60%" stop-color="#C8354A"/>
      <stop offset="100%" stop-color="#8E1B2A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="240" fill="#0A0A0C"/>
  <rect width="1280" height="240" fill="url(#grid)"/>
  <rect width="1280" height="240" fill="url(#glow)"/>

  <text x="960" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="190" font-weight="700" fill="#8E1B2A" opacity="0.10">&lt;/&gt;</text>

  <rect x="48" y="66" width="3" height="108" rx="1.5" fill="#C8354A"/>

  <text x="76" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="7" fill="#C8354A">SOFTWARE ENGINEER</text>

  <text x="74" y="174" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#F2F2F3">YOUSSEF MOHAMMED</text>

  <rect x="0" y="238" width="1280" height="2" fill="url(#edge)"/>
</svg>
